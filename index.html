<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codewords Game</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; text-align: center; background: #f8f8f8; margin: 0; }
  header { padding: 14px 10px 6px; }
  #board, #pattern {
    display: grid;
    grid-template-columns: repeat(5, 1fr); /* always 5 columns */
    gap: 6px;
    justify-content: center;
    margin: 10px auto 16px;
    max-width: min(95vw, 800px);
    padding: 0 10px;
  }
  .card {
    border: 2px solid #333;
    aspect-ratio: 4 / 3;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    background: white;
    user-select: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
    font-size: clamp(10px, 2.6vw, 18px);
    letter-spacing: .4px;
  }
  .revealed.red    { background: #e74c3c; color: #fff; }
  .revealed.blue   { background: #3b82f6; color: #fff; }
  .revealed.neutral{ background: #d9d9d9; }
  .revealed.black  { background: #111; color: #fff; }
  #controls { margin: 8px 0 4px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #message { font-size: 1.05em; margin: 6px 10px 10px; min-height: 1.4em; }
  #hud { margin: 6px 10px 0; font-size: 0.98em; line-height: 1.5; }
  button { margin: 3px; padding: 8px 12px; border-radius: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
  button:hover { background: #f1f1f1; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-weight: 700; color: #fff; }
  .pill.red { background: #e74c3c; }
  .pill.blue { background: #3b82f6; }

  /* Make pattern btn more prominent and less likely to misclick */
  #patternBtn {
    background: #ffe99f;
    border: 2px solid #e1b800;
    font-weight: 700;
    color: #7c6700;
    font-size: 1.03em;
    min-width: 140px;
    min-height: 40px;
    box-shadow: 0 2px 10px -5px #e1b80090;
    transition: background 0.16s, box-shadow 0.16s;
  }
  #patternBtn:hover, #patternBtn:focus {
    background: #fff5cc;
    box-shadow: 0 4px 16px -4px #e1b800a0;
    outline: 2px solid #e1b80080;
  }
  /* Add spacing for new turn button */
  #turnBtn {
    background: #e3e3fd;
    border: 2px solid #4d64e1;
    color: #2b307e;
    font-weight: 700;
    font-size: 1.03em;
    min-width: 120px;
    min-height: 40px;
    box-shadow: 0 2px 10px -5px #4d64e190;
    transition: background 0.16s, box-shadow 0.16s;
  }
  #turnBtn:hover, #turnBtn:focus {
    background: #f0f2ff;
    box-shadow: 0 4px 16px -4px #4d64e1a0;
    outline: 2px solid #4d64e180;
  }
</style>
</head>
<body>

<header>
  <h1 style="margin:0">Codewords</h1>
  <div id="controls">
    <button id="patternBtn" onclick="togglePattern()" aria-label="Show or hide the pattern (spymaster view)">👁 Show/Hide Pattern</button>
    <button id="turnBtn" onclick="changeTurn()" aria-label="Change team turn">🔄 Change Turn</button>
    <button onclick="newGame()" id="restartBtn">Restart</button>
    <button id="langBtn" onclick="switchLang()">Switch to English</button>
  </div>
</header>

<div id="hud"></div>
<div id="message"></div>

<div id="pattern" style="display:none;"></div>

// === texts ===
const TEXTS = {
  EN: {
    red: "Red",
    blue: "Blue",
    neutral: "Neutral",
    black: "Black",
    turn: "Turn:",
    remaining: "Remaining",
    gameover_black: "💀 Black card clicked! Game over.",
    win_red: "🏆 Red team wins!",
    win_blue: "🏆 Blue team wins!",
    again: "again",
    now: "now",
    change_turn: "Change Turn"
  },
  IT: {
    red: "Rosso",
    blue: "Blu",
    neutral: "Neutro",
    black: "Nero",
    turn: "Turno:",
    remaining: "Rimasti",
    gameover_black: "💀 Carta nera! Partita finita.",
    win_red: "🏆 Vince la squadra rossa!",
    win_blue: "🏆 Vince la squadra blu!",
    again: "ancora",
    now: "ora",
    change_turn: "Cambia turno"
  }
};

function sanitizeList(list) {
  // Ensure ASCII only and length 4..12, uppercase; remove duplicates.
  const ascii = list
    .map(w => (w || "").toString().toUpperCase().replace(/[^A-Z]/g, "")
    .filter(w => w.length >= 4 && w.length <= 12);
  return Array.from(new Set(ascii));
}

function loadWords() {
  let raw = (currentLang === "EN") ? LIST_EN : LIST_IT;
  WORDS = sanitizeList(raw);
  newGame();
}

function newGame() {
  if (WORDS.length === 0) return;
  gameOver = false;
  currentTurn = "red"; // red starts
  document.getElementById("message").innerText = "";

  words = [];
  let pool = WORDS.slice();
  for (let i = 0; i < 25; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    words.push(pool.splice(idx, 1)[0]);
  }

  let roles = [
    "red","red","red","red","red","red","red","red","red",
    "blue","blue","blue","blue","blue","blue","blue","blue",
    "neutral","neutral","neutral","neutral","neutral","neutral","neutral",
    "black"
  ];
  shuffle(roles);
  pattern = {};
  revealed = {};
  words.forEach((w,i) => { pattern[w] = roles[i]; revealed[w] = false; });

  drawBoard();
  drawPattern();
  updateHUD();
  localizeButtons();
}

function drawBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  words.forEach(w => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerText = w;
    div.onclick = () => reveal(w, div);
    board.appendChild(div);
  });
}

function drawPattern() {
  const pat = document.getElementById("pattern");
  pat.innerHTML = "";
  words.forEach(w => {
    const div = document.createElement("div");
    div.className = "card revealed " + pattern[w];
    div.innerText = w;
    pat.appendChild(div);
  });
}

function reveal(w, div) {
  if (gameOver || revealed[w]) return;
  revealed[w] = true;
  div.classList.add("revealed", pattern[w]);

  const t = TEXTS[currentLang];
  let msg = "";

  if (pattern[w] === "black") {
    endGame(t.gameover_black);
    return;
  } else if (pattern[w] === currentTurn) {
    msg = `${t[pattern[w]]} card, ${t.turn} ${t[currentTurn]} ${t.again}.`;
  } else if (pattern[w] === "neutral") {
    currentTurn = (currentTurn === "red") ? "blue" : "red";
    msg = `${t.neutral}, ${t.turn} ${t[currentTurn]}`;
  } else {
    currentTurn = (currentTurn === "red") ? "blue" : "red";
    msg = `${t[pattern[w]]} card, ${t.now} ${t.turn} ${t[currentTurn]}`;
  }

  updateHUD(msg);
  checkWin();
}

function checkWin() {
  const redsLeft = words.filter(w => pattern[w] === "red" && !revealed[w]).length;
  const bluesLeft = words.filter(w => pattern[w] === "blue" && !revealed[w]).length;
  const t = TEXTS[currentLang];
  if (redsLeft === 0) { endGame(t.win_red); return; }
  if (bluesLeft === 0) { endGame(t.win_blue); return; }
}

function endGame(msg) {
  gameOver = true;
  document.getElementById("message").innerText = msg;
  document.querySelectorAll("#board .card").forEach(div => {
    const word = div.innerText;
    div.classList.add("revealed", pattern[word]);
  });
  updateHUD();
}

function updateHUD(msg="") {
  const t = TEXTS[currentLang];
  const redsLeft = words.filter(w => pattern[w] === "red" && !revealed[w]).length;
  const bluesLeft = words.filter(w => pattern[w] === "blue" && !revealed[w]).length;

  const turnPill = `<span class="pill ${currentTurn}">${t[currentTurn]}</span>`;
  let hudText = `
    <strong>${t.red}</strong> ${t.remaining}: ${redsLeft} &nbsp;&nbsp;
    <strong>${t.blue}</strong> ${t.remaining}: ${bluesLeft} <br>
    ${t.turn} ${turnPill}
  `;
  if (msg) hudText += `<br>${msg}`;
  document.getElementById("hud").innerHTML = hudText;
}

function togglePattern() {
  const pat = document.getElementById("pattern");
  pat.style.display = (pat.style.display === "none") ? "grid" : "none";
  // Update button label per language
  const show = (pat.style.display === "grid");
  localizeButtons();
}

function switchLang() {
  if (currentLang === "EN") {
    currentLang = "IT";
  } else {
    currentLang = "EN";
  }
  loadWords();
  localizeButtons();
}

function changeTurn() {
  if (gameOver) return;
  currentTurn = (currentTurn === "red") ? "blue" : "red";
  updateHUD();
}

function localizeButtons() {
  const t = TEXTS[currentLang];
  // Pattern button label
  const pat = document.getElementById("pattern");
  const show = (pat.style.display === "grid");
  const patternBtn = document.getElementById("patternBtn");
  if (currentLang === "EN") patternBtn.textContent = show ? "👁 Hide Pattern" : "👁 Show Pattern";
  else patternBtn.textContent = show ? "👁 Nascondi Pattern" : "👁 Mostra Pattern";
  // Lang button
  const langBtn = document.getElementById("langBtn");
  langBtn.innerText = (currentLang === "EN") ? "Switch to Italian" : "Switch to English";
  // Turn button
  const turnBtn = document.getElementById("turnBtn");
  turnBtn.innerText = t.change_turn;
  // Restart button
  const restartBtn = document.getElementById("restartBtn");
  restartBtn.innerText = (currentLang === "EN") ? "Restart" : "Ricomincia";
}

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

window.onload = function() {
  loadWords();
  localizeButtons();
};
</script>
